<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img"><rect width="760" height="320" rx="10" fill="#1a1a19"/><defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#898781"/></marker></defs><text x="28.0" y="38.0" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="18" font-weight="600" fill="#ffffff" text-anchor="start">The whole model</text><text x="28.0" y="60.0" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">13.81M parameters. At every position it scores all 8,000 possible next tokens.</text><line x1="28" y1="76" x2="732" y2="76" stroke="#2c2c2a" stroke-width="1"/><path d="M149,130 C149,92 580,92 580,130" fill="none" stroke="#3987e5" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="286" y="93" width="156" height="16" fill="#1a1a19"/><text x="364.0" y="105.0" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="middle">same matrix: weight tying</text><text x="28.0" y="164.0" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">tokens</text><path d="M72,160 H85" fill="none" stroke="#898781" stroke-width="1.75" marker-end="url(#am)"/><rect x="86" y="132" width="126" height="56" rx="8" fill="#3987e5"/><text x="149.0" y="157.0" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">Token embedding</text><text x="149.0" y="173.0" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="11" font-weight="400" fill="#0b0b0b" text-anchor="middle">8,000 × 384 · 3.07M</text><path d="M212,160 H222" fill="none" stroke="#898781" stroke-width="1.75" marker-end="url(#am)"/><circle cx="234" cy="160" r="11" fill="#1a1a19" stroke="#c3c2b7" stroke-width="2"/><text x="234.0" y="165.5" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">+</text><rect x="159" y="216" width="150" height="44" rx="8" fill="#1c5cab"/><text x="234.0" y="235.0" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Position embedding</text><text x="234.0" y="251.0" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="11" font-weight="400" fill="#ffffff" text-anchor="middle">256 × 384 · 98K</text><path d="M234,216 V172" fill="none" stroke="#898781" stroke-width="1.75" marker-end="url(#am)"/><path d="M245,160 H265" fill="none" stroke="#898781" stroke-width="1.75" marker-end="url(#am)"/><rect x="274" y="124" width="126" height="56" rx="8" fill="#2c2c2a"/><rect x="270" y="128" width="126" height="56" rx="8" fill="#2c2c2a"/><rect x="266" y="132" width="126" height="56" rx="8" fill="#383835"/><text x="329.0" y="157.0" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">6 × Block</text><text x="329.0" y="173.0" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="11" font-weight="400" fill="#ffffff" text-anchor="middle">10.64M params</text><rect x="276" y="179" width="34.3" height="4" rx="2" fill="#d95926"/><rect x="312.3" y="179" width="69.7" height="4" rx="2" fill="#199e70"/><path d="M401,160 H415" fill="none" stroke="#898781" stroke-width="1.75" marker-end="url(#am)"/><rect x="416" y="132" width="80" height="56" rx="8" fill="#383835"/><text x="456.0" y="157.0" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">LayerNorm</text><text x="456.0" y="173.0" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="11" font-weight="400" fill="#ffffff" text-anchor="middle">final</text><path d="M496,160 H517" fill="none" stroke="#898781" stroke-width="1.75" marker-end="url(#am)"/><rect x="518" y="132" width="124" height="56" rx="8" fill="#3987e5"/><text x="580.0" y="157.0" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">Output head</text><text x="580.0" y="173.0" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="11" font-weight="400" fill="#0b0b0b" text-anchor="middle">tied: no new params</text><path d="M642,160 H653" fill="none" stroke="#898781" stroke-width="1.75" marker-end="url(#am)"/><text x="658.0" y="157.0" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">next-token</text><text x="658.0" y="173.0" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">scores</text><text x="28.0" y="296.0" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="12" font-weight="400" fill="#898781" text-anchor="start">The output head reuses the token embedding matrix, so it adds no parameters.</text></svg>