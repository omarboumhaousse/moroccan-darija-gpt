<svg xmlns="http://www.w3.org/2000/svg" width="760" height="316" viewBox="0 0 760 316" role="img"><rect width="760" height="316" rx="10" fill="#fcfcfb"/><text x="28.0" y="38.0" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="18" font-weight="600" fill="#0b0b0b" text-anchor="start">What a checkpoint carries</text><text x="28.0" y="60.0" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="13" font-weight="400" fill="#52514e" text-anchor="start">165.9 MB written to the bucket every 500 steps, and once at the end</text><line x1="28" y1="76" x2="732" y2="76" stroke="#e1e0d9" stroke-width="1"/><rect x="28.0" y="112" width="232.2" height="46" fill="#2a78d6"/><text x="144.1" y="184.0" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">Model weights</text><text x="144.1" y="202.0" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="12" font-weight="400" fill="#898781" text-anchor="middle">55.2 MB   33%</text><path d="M262.2,112 H727.2 A4,4 0 0 1 731.2,116 V154 A4,4 0 0 1 727.2,158 H262.2 Z" fill="#1baf7a"/><text x="496.7" y="184.0" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">Optimizer state</text><text x="496.7" y="202.0" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="12" font-weight="400" fill="#898781" text-anchor="middle">110.5 MB   67%</text><text x="28.0" y="240.0" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="12" font-weight="400" fill="#898781" text-anchor="start">AdamW keeps two running averages per parameter, so its state is twice the model's 55 MB.</text><text x="28.0" y="260.0" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="12" font-weight="400" fill="#898781" text-anchor="start">The rest (step number, model config, loss history, scaler state) is 0.2 MB.</text><text x="28.0" y="280.0" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="12" font-weight="400" fill="#898781" text-anchor="start">The tied matrix appears twice in the state dict but is stored once in the file, and comes back shared.</text></svg>