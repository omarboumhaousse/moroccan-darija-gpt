<svg xmlns="http://www.w3.org/2000/svg" width="760" height="316" viewBox="0 0 760 316" role="img"><rect width="760" height="316" rx="10" fill="#fcfcfb"/><defs><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#898781"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs><text x="28.0" y="38.0" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="18" font-weight="600" fill="#0b0b0b" text-anchor="start">One transformer block</text><text x="28.0" y="60.0" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="13" font-weight="400" fill="#52514e" text-anchor="start">The model stacks 6 of these, 1.77M parameters each</text><line x1="28" y1="76" x2="732" y2="76" stroke="#e1e0d9" stroke-width="1"/><line x1="56" y1="222" x2="341" y2="222" stroke="#52514e" stroke-width="3" stroke-linecap="round"/><line x1="363" y1="222" x2="649" y2="222" stroke="#52514e" stroke-width="3" stroke-linecap="round"/><line x1="671" y1="222" x2="700" y2="222" stroke="#52514e" stroke-width="3" stroke-linecap="round" marker-end="url(#as)"/><text x="40.0" y="227.0" font-family='ui-monospace, "Cascadia Code", Consolas, Menlo, monospace' font-size="15" font-weight="400" fill="#0b0b0b" text-anchor="middle">x</text><text x="720.0" y="227.0" font-family='ui-monospace, "Cascadia Code", Consolas, Menlo, monospace' font-size="15" font-weight="400" fill="#0b0b0b" text-anchor="middle">x</text><text x="208.0" y="212.0" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="11" font-weight="400" fill="#898781" text-anchor="middle">residual stream</text><circle cx="76" cy="222" r="3.5" fill="#52514e"/><path d="M76,222 V145.0 H91" fill="none" stroke="#898781" stroke-width="1.75" marker-end="url(#ab)"/><path d="M172,145.0 H189" fill="none" stroke="#898781" stroke-width="1.75" marker-end="url(#ab)"/><path d="M330,145.0 H352 V210" fill="none" stroke="#898781" stroke-width="1.75" marker-end="url(#ab)"/><rect x="92" y="122" width="80" height="46" rx="8" fill="#f0efec"/><text x="132.0" y="142.0" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">LayerNorm</text><text x="132.0" y="158.0" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="11" font-weight="400" fill="#0b0b0b" text-anchor="middle">768 params</text><rect x="190" y="122" width="140" height="46" rx="8" fill="#eb6834"/><text x="260.0" y="142.0" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">Attention</text><text x="260.0" y="158.0" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="11" font-weight="400" fill="#0b0b0b" text-anchor="middle">6 heads · 590K params</text><circle cx="352" cy="222" r="11" fill="#fcfcfb" stroke="#52514e" stroke-width="2"/><text x="352.0" y="227.5" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="16" font-weight="600" fill="#0b0b0b" text-anchor="middle">+</text><circle cx="384" cy="222" r="3.5" fill="#52514e"/><path d="M384,222 V145.0 H399" fill="none" stroke="#898781" stroke-width="1.75" marker-end="url(#ab)"/><path d="M480,145.0 H497" fill="none" stroke="#898781" stroke-width="1.75" marker-end="url(#ab)"/><path d="M638,145.0 H660 V210" fill="none" stroke="#898781" stroke-width="1.75" marker-end="url(#ab)"/><rect x="400" y="122" width="80" height="46" rx="8" fill="#f0efec"/><text x="440.0" y="142.0" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">LayerNorm</text><text x="440.0" y="158.0" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="11" font-weight="400" fill="#0b0b0b" text-anchor="middle">768 params</text><rect x="498" y="122" width="140" height="46" rx="8" fill="#1baf7a"/><text x="568.0" y="142.0" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">MLP</text><text x="568.0" y="158.0" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="11" font-weight="400" fill="#0b0b0b" text-anchor="middle">1.18M params</text><circle cx="660" cy="222" r="11" fill="#fcfcfb" stroke="#52514e" stroke-width="2"/><text x="660.0" y="227.5" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="16" font-weight="600" fill="#0b0b0b" text-anchor="middle">+</text><text x="214.0" y="256.0" font-family='ui-monospace, "Cascadia Code", Consolas, Menlo, monospace' font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">x = x + attention(layernorm(x))</text><text x="522.0" y="256.0" font-family='ui-monospace, "Cascadia Code", Consolas, Menlo, monospace' font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">x = x + mlp(layernorm(x))</text><text x="28.0" y="292.0" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="12" font-weight="400" fill="#898781" text-anchor="start">LayerNorm sits on the branches, not on the stream, so the path from input to output is a plain sum.</text></svg>