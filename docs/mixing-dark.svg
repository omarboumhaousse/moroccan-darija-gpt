<svg xmlns="http://www.w3.org/2000/svg" width="760" height="306" viewBox="0 0 760 306" role="img"><rect width="760" height="306" rx="10" fill="#1a1a19"/><text x="28.0" y="38.0" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="18" font-weight="600" fill="#ffffff" text-anchor="start">Attention mixes tokens. The MLP doesn't.</text><text x="28.0" y="60.0" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">Swap one token for another and see which outputs change</text><line x1="28" y1="76" x2="732" y2="76" stroke="#2c2c2a" stroke-width="1"/><text x="28.0" y="116.0" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="13" font-weight="600" fill="#ffffff" text-anchor="start">Input</text><text x="28.0" y="130.0" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="11" font-weight="400" fill="#898781" text-anchor="start">one token swapped</text><text x="28.0" y="164.0" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="13" font-weight="600" fill="#ffffff" text-anchor="start">Attention</text><text x="28.0" y="178.0" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="11" font-weight="400" fill="#898781" text-anchor="start">7 of 11 outputs change</text><text x="28.0" y="202.0" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="13" font-weight="600" fill="#ffffff" text-anchor="start">MLP</text><text x="28.0" y="216.0" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="11" font-weight="400" fill="#898781" text-anchor="start">1 of 11 outputs change</text><rect x="691.0" y="98" width="40.0" height="38" rx="5" fill="#383835"/><text x="711.0" y="123.0" font-family='"Segoe UI", "Noto Sans Arabic", "Geeza Pro", Tahoma, sans-serif' font-size="15" font-weight="400" fill="#ffffff" text-anchor