<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img"><rect width="760" height="320" rx="10" fill="#fcfcfb"/><text x="28.0" y="38.0" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="18" font-weight="600" fill="#0b0b0b" text-anchor="start">Half precision, twice the speed</text><text x="28.0" y="60.0" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="13" font-weight="400" fill="#52514e" text-anchor="start">40 real training steps at batch 64 on the pod's Tesla T4, same seed and same data</text><line x1="28" y1="76" x2="732" y2="76" stroke="#e1e0d9" stroke-width="1"/><text x="28.0" y="122.0" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="start">fp32</text><text x="28.0" y="138.0" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="11" font-weight="400" fill="#898781" text-anchor="start">no autocast</text><path d="M200.0,106 H596.0 A4,4 0 0 1 600.0,110 V136 A4,4 0 0 1 596.0,140 H200.0 Z" fill="#c3c2b7"/><text x="610.0" y="129.0" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="start">527 ms per step</text><text x="28.0" y="180.0" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="start">fp16</text><text x="28.0" y="196.0" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="11" font-weight="400" fill="#898781" text-anchor="start">autocast + GradScaler</text><path d="M200.0,164 H397.1 A4,4 0 0 1 401.1,168 V194 A4,4 0 0 1 397.1,198 H200.0 Z" fill="#2a78d6"/><text x="411.1" y="187.0" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="start">265 ms per step</text><text x="523.1" y="187.0" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="13" font-weight="600" fill="#52514e" text-anchor="start">   2.0x faster</text><text x="28.0" y="244.0" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="12" font-weight="400" fill="#898781" text-anchor="start">Identical results: train loss 7.6180 and val loss 7.6446 after 40 steps, in both runs.</text><text x="28.0" y="264.0" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="12" font-weight="400" fill="#898781" text-anchor="start">Peak GPU memory 4.76 GB in fp32, 5.10 GB in fp16: the tensors kept in fp32 sit alongside their fp16 copies.</text><text x="28.0" y="284.0" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="12" font-weight="400" fill="#898781" text-anchor="start">At this speed one pass over the 284M-token corpus takes about 1 h 17 min.</text></svg>